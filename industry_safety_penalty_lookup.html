<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KSIC 전 업종 산업안전보건 규칙·과태료 조회기</title>
  <style>
    :root {
      --bg1: #f2f7f6;
      --bg2: #e8eef8;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #475569;
      --line: #dbe3ee;
      --accent: #0f766e;
      --accent2: #1d4ed8;
      --warn: #9a3412;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Noto Sans KR", "Malgun Gothic", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 10% 0%, #d9f2ee 0%, transparent 35%),
        radial-gradient(circle at 90% 10%, #dbeafe 0%, transparent 30%),
        linear-gradient(180deg, var(--bg1), var(--bg2));
      min-height: 100vh;
      padding: 24px;
    }

    .container {
      max-width: 1120px;
      margin: 0 auto;
      display: grid;
      gap: 16px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: 0 8px 22px rgba(15, 23, 42, 0.06);
      padding: 18px;
    }

    h1 { margin: 0 0 6px; font-size: 26px; line-height: 1.2; }

    .sub, .meta, .note {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.55;
    }

    .search-wrap {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      margin-top: 12px;
    }

    .extra-grid {
      margin-top: 10px;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .field {
      display: grid;
      gap: 6px;
    }

    .field label {
      font-size: 13px;
      color: var(--muted);
    }

    input[type="text"],
    input[type="number"] {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 15px;
      outline: none;
    }

    input[type="text"]:focus,
    input[type="number"]:focus {
      border-color: var(--accent2);
      box-shadow: 0 0 0 3px rgba(29, 78, 216, 0.12);
    }

    .check-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 14px;
      margin-top: 2px;
    }

    .check-row label {
      font-size: 13px;
      color: #334155;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 0 16px;
      font-size: 14px;
      font-weight: 700;
      color: #fff;
      background: linear-gradient(135deg, var(--accent), #0d9488);
      cursor: pointer;
    }

    button:hover { filter: brightness(1.03); }

    .live-box {
      margin-top: 8px;
      border: 1px dashed #cbd5e1;
      border-radius: 10px;
      padding: 10px;
      background: #f8fafc;
    }

    .live-title {
      font-size: 12px;
      color: #475569;
      margin-bottom: 6px;
      font-weight: 700;
    }

    .tag-list {
      margin-top: 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tag {
      border: 1px solid #bfded8;
      background: #eefaf8;
      color: #0f766e;
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 12px;
      cursor: pointer;
      user-select: none;
    }

    .result-title {
      margin: 0 0 8px;
      font-size: 20px;
      color: #0b3f3a;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      border: 1px solid var(--line);
      margin-top: 8px;
    }

    th, td {
      border: 1px solid var(--line);
      padding: 10px;
      text-align: left;
      vertical-align: top;
      font-size: 14px;
      line-height: 1.45;
    }

    th {
      background: #f5f9ff;
      color: #1e3a8a;
      font-weight: 700;
    }

    .warn {
      border: 1px solid #fed7aa;
      background: #fff7ed;
      color: var(--warn);
      border-radius: 10px;
      padding: 10px;
      font-size: 13px;
      line-height: 1.5;
      margin-top: 12px;
    }

    .links a { color: var(--accent2); text-decoration: none; }
    .links a:hover { text-decoration: underline; }

    .empty { color: var(--muted); font-size: 14px; padding: 8px 0; }

    .match-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    .match {
      border: 1px solid #cbd5e1;
      background: #fff;
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 12px;
      color: #1e293b;
      cursor: pointer;
    }

    .match:hover {
      border-color: #94a3b8;
      background: #f8fafc;
    }

    code {
      background: #f1f5f9;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      padding: 1px 6px;
      font-size: 12px;
    }

    @media (max-width: 760px) {
      .search-wrap { grid-template-columns: 1fr; }
      .extra-grid { grid-template-columns: 1fr; }
      button { height: 42px; }
    }
  </style>
</head>
<body>
  <main class="container">
    <section class="card">
      <h1>KSIC 전 업종 산업안전보건 규칙·과태료 조회기</h1>
      <p class="sub">업종명 또는 KSIC 코드(예: <code>20129</code>, <code>C</code>)를 입력하면 해당 업종의 KSIC 분류를 인식해 사업주가 우선 확인할 조문을 보여줍니다.</p>
      <p class="meta" id="loadedMeta">KSIC 데이터 로딩 중...</p>
      <div class="search-wrap">
        <input id="industryInput" type="text" placeholder="예: 플라스틱 용기 제조업, 시스템 소프트웨어 개발 및 공급업, 20129" />
        <button id="searchBtn" type="button">조회</button>
      </div>
      <div class="live-box" id="liveBox">
        <div class="live-title">입력 중 유사 업종 예시</div>
        <div class="match-list" id="liveMatches"><span class="empty">업종 키워드를 입력하면 유사 업종을 보여줍니다.</span></div>
      </div>
      <div class="extra-grid">
        <div class="field">
          <label for="workerCountInput">상시 근로자 수(명)</label>
          <input id="workerCountInput" type="number" min="0" step="1" placeholder="예: 12" />
        </div>
        <div class="field">
          <label for="officeInput">관할지청명(선택)</label>
          <input id="officeInput" type="text" placeholder="예: 서울강남지청, 부산지방고용노동청" />
        </div>
      </div>
      <div class="extra-grid">
        <div class="field">
          <label>별표1 수동 체크(해당 시)</label>
          <div class="check-row">
            <label><input id="officeOnlyInput" type="checkbox" /> 사무직만 사용 사업장</label>
            <label><input id="mineLawInput" type="checkbox" /> 광산안전법 적용</label>
            <label><input id="nuclearLawInput" type="checkbox" /> 원자력안전법 적용</label>
            <label><input id="aviationLawInput" type="checkbox" /> 항공안전법 적용</label>
            <label><input id="shipLawInput" type="checkbox" /> 선박안전법 적용</label>
          </div>
        </div>
        <div class="field"></div>
      </div>
      <div class="tag-list" id="suggestions"></div>
      <p class="note">입력 예시: 업종명(부분 검색 가능), KSIC 코드(1~5자리). 상시 근로자 수를 함께 넣으면 산업안전보건법 시행령 별표1 적용 제외 여부를 함께 판정합니다.</p>
    </section>

    <section class="card" id="resultBox">
      <p class="empty">업종을 입력하고 조회 버튼을 누르세요.</p>
    </section>
  </main>

      Q: ["병원·요양시설 근골격계 부담작업 관리", "감염성 물질 취급 보호구 기준", "사회복지시설 적용 제외 규정 해석", "야간·교대근무 건강관리 기준", "감정노동 종사자 보호조치"],
      default: ["위험성평가 시행·기록 방식", "안전보건교육 실시 주기·대상", "도급 시 안전보건 협의체 운영 기준", "보호구 지급·착용관리 의무", "작업환경측정 및 건강진단 대상 판단"]
    };

    const inputEl = document.getElementById("industryInput");
    const workerCountEl = document.getElementById("workerCountInput");
    const officeEl = document.getElementById("officeInput");
    const officeOnlyEl = document.getElementById("officeOnlyInput");
    const mineLawEl = document.getElementById("mineLawInput");
    const nuclearLawEl = document.getElementById("nuclearLawInput");
    const aviationLawEl = document.getElementById("aviationLawInput");
    const shipLawEl = document.getElementById("shipLawInput");
    const btnEl = document.getElementById("searchBtn");
    const resultEl = document.getElementById("resultBox");
    const suggEl = document.getElementById("suggestions");
    const metaEl = document.getElementById("loadedMeta");
    const liveMatchesEl = document.getElementById("liveMatches");
    let qnaRenderToken = 0;
    const qnaResultCache = new Map();

    const CODE_TO_ITEM = new Map(KSIC.map((row) => [row.code, row]));

    function escapeHtml(str) {
      return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    function normalize(value) {
      return String(value || "").toLowerCase().replace(/\s+/g, "").replace(/[()\[\],./·\-~;:]/g, "");
    }

    function containsNorm(text, keyword) {
      return normalize(text).includes(normalize(keyword));
    }

    function sectionFromCode(code) {
      if (/^[A-U]$/.test(code)) return code;
      const div = Number(String(code).slice(0, 2));
      if (!Number.isFinite(div)) return null;
      for (const [start, end, section] of SECTION_BY_DIVISION) {
        if (div >= start && div <= end) return section;
      }
      return null;
    }

    function getDivision(code) {
      if (/^[A-U]$/.test(code)) return null;
      const n = Number(String(code).slice(0, 2));
      return Number.isFinite(n) ? n : null;
    }

    function getContext(mainItem) {
      const rawCode = String(mainItem.code);
      const section = sectionFromCode(rawCode);
      const codes = [];
      if (section) codes.push(section);
      if (!/^[A-U]$/.test(rawCode)) {
        if (rawCode.length >= 2) codes.push(rawCode.slice(0, 2));
        if (rawCode.length >= 3) codes.push(rawCode.slice(0, 3));
        if (rawCode.length >= 4) codes.push(rawCode.slice(0, 4));
        if (rawCode.length >= 5) codes.push(rawCode.slice(0, 5));
      }
      const names = [...new Set(codes)].map((code) => (CODE_TO_ITEM.get(code) || {}).name).filter(Boolean);
      return { section, division: getDivision(rawCode), names, normalizedJoined: normalize(names.join(" ")) };
    }

    function linkifyLawText(rawText, lawType) {
      let out = escapeHtml(rawText);
      const base = LAW_BASE[lawType];
      if (base) {
        out = out.replace(/(제\d+조(?:의\d+)?)/g, (m) => `<a href="${encodeURI(`${base}/${m}`)}" target="_blank" rel="noopener noreferrer">${m}</a>`);
      }
      if (lawType === "decree") {
        out = out.replace(/(별표\s*1|별표1)/g, (m) => `<a href="${encodeURI(`${LAW_BASE.decree}/별표1`)}" target="_blank" rel="noopener noreferrer">${m}</a>`);
      }
      return out;
    }

    function renderTable(headers, rows, htmlCols) {
      const richCols = new Set(Array.isArray(htmlCols) ? htmlCols : []);
      const head = headers.map((h) => `<th>${escapeHtml(h)}</th>`).join("");
      const body = rows.map((r) => `<tr>${r.map((c, idx) => `<td>${richCols.has(idx) ? c : escapeHtml(c)}</td>`).join("")}</tr>`).join("");
      return `<table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>`;
    }

    function searchKSIC(query, limit) {
      const raw = String(query || "").trim();
      const qNorm = normalize(raw);
      if (!qNorm) return [];

      const codeLike = raw.toUpperCase();
      if (/^[A-U]$/.test(codeLike) || /^\d{2,5}$/.test(codeLike)) {
        const exact = CODE_TO_ITEM.get(codeLike);
        if (exact) return [exact];
      }

      const scored = [];
      for (const item of KSIC) {
        const nameNorm = normalize(item.name);
        const code = item.code;
        let score = 0;
        if (nameNorm === qNorm) score += 120;
        else if (nameNorm.startsWith(qNorm)) score += 95;
        else if (nameNorm.includes(qNorm)) score += 80;
        if (qNorm.includes(nameNorm) && nameNorm.length > 1) score += 25;
        if (code.toLowerCase() === qNorm) score += 140;
        else if (code.toLowerCase().startsWith(qNorm)) score += 45;
        if (score > 0) scored.push({ item, score });
      }

      scored.sort((a, b) => b.score - a.score || b.item.digit - a.item.digit || a.item.code.localeCompare(b.item.code));
      return scored.slice(0, Number.isFinite(limit) ? limit : 20).map((v) => v.item);
    }

    function getRulesBySection(section) {
      return [...COMMON_RULES, ...(SECTION_RULES[section] || [])];
    }

    function getMoelQnaBySection(section) {
      return MOEL_QNA_TOP_BY_SECTION[section] || MOEL_QNA_TOP_BY_SECTION.default;
    }

    function makeMoelSearchLink(keyword) {
      return `https://1350.moel.go.kr/home/hp/counsel/csinfo.do?cs_idx=2&where=faq&keyword=${encodeURIComponent(keyword)}`;
    }

    function makeMoelMainSearchLink(keyword, officeName) {
      const query = officeName ? `${officeName} 산업안전 질의회시 ${keyword}` : `산업안전 질의회시 ${keyword}`;
      return `https://www.moel.go.kr/search.do?collection=ALL&query=${encodeURIComponent(query)}`;
    }

    function makeMoelDistrictSearchLink(keyword, officeName) {
      if (!officeName) return "";
      const query = `${officeName} 지청 산업안전 질의회시 ${keyword}`;
      return `https://www.moel.go.kr/search.do?collection=ALL&query=${encodeURIComponent(query)}`;
    }

    function makeMoelProxyLink(keyword) {
      return `https://r.jina.ai/http://1350.moel.go.kr/home/hp/counsel/csinfo.do?cs_idx=2&where=faq&keyword=${encodeURIComponent(keyword)}`;
    }

    function makeProxyUrl(url) {
      return `https://r.jina.ai/http://${url.replace(/^https?:\/\//, "")}`;
    }

    async function hasSearchResultFromUrl(url) {
      if (!url) return false;
      if (qnaResultCache.has(url)) return qnaResultCache.get(url);
      try {
        const res = await fetch(makeProxyUrl(url));
        if (!res.ok) {
          qnaResultCache.set(url, false);
          return false;
        }
        const text = (await res.text()).toLowerCase();
        const noHit =
          text.includes("검색 결과가 없습니다") ||
          text.includes("검색결과가 없습니다") ||
          text.includes("검색된 결과가 없습니다") ||
          text.includes("검색 결과 없음") ||
          text.includes("no results");
        const hit = !noHit;
        qnaResultCache.set(url, hit);
        return hit;
      } catch (_) {
        qnaResultCache.set(url, false);
        return false;
      }
    }

    async function hasOfficialQnaResult(keyword, officeName) {
      const checks = [
        hasSearchResultFromUrl(makeMoelSearchLink(keyword)),
        hasSearchResultFromUrl(makeMoelMainSearchLink(keyword, "")),
        hasSearchResultFromUrl(makeMoelDistrictSearchLink(keyword, officeName))
      ];
      const results = await Promise.all(checks);
      return results.some(Boolean);
    }

    async function renderQnaTableVerified(topics, token, officeName) {
      const checks = await Promise.all(topics.map(async (topic) => ({
        topic,
        ok: await hasOfficialQnaResult(topic, officeName)
      })));
      if (token !== qnaRenderToken) return "";
      const filtered = checks.filter((v) => v.ok).slice(0, 5).map((v) => v.topic);
      if (!filtered.length) {
        return `<p class="empty">확인 가능한 질의회시 검색결과가 없어 표시할 항목이 없습니다.</p>`;
      }
      const qnaRows = filtered.map((topic, idx) => [
        `${idx + 1}`,
        `<a href="${makeMoelSearchLink(topic)}" target="_blank" rel="noopener noreferrer">${escapeHtml(topic)}</a>`,
        "고용노동부 고객상담센터(1350)"
      ]);
      return renderTable(["No", "고용노동부 질의회시 주제(자주 조회 예시)", "바로가기"], qnaRows, [1]);
    }

    function evaluateAnnex1(mainItem, workerCount, manualFlags) {
      const ctx = getContext(mainItem);
      const m = ctx.normalizedJoined;
      const d = ctx.division;
      const entries = [];

      if (manualFlags.mineLaw || manualFlags.nuclearLaw || manualFlags.aviationLaw || manualFlags.shipLaw) {
        entries.push({ item: "제1호", reason: "광산/원자력/항공/선박 안전 관련 타법 적용 사업(수동 체크)", excluded: "별표1 제1호 적용 제외 규정(법 제13·14·15·제3장 등)" });
      }

      const item2 = containsNorm(m, "소프트웨어 개발 및 공급업") || containsNorm(m, "컴퓨터 프로그래밍") || containsNorm(m, "시스템 통합 및 관리업") || containsNorm(m, "정보서비스업") || ctx.section === "K" || containsNorm(m, "전문서비스업") || containsNorm(m, "건축기술, 엔지니어링 및 기타 과학기술 서비스업") || (containsNorm(m, "기타 전문, 과학 및 기술 서비스업") && !containsNorm(m, "사진 처리업")) || containsNorm(m, "사업지원 서비스업") || containsNorm(m, "사회복지 서비스업");
      if (item2) entries.push({ item: "제2호", reason: "소프트웨어·정보서비스·금융보험·전문과학기술·사업지원·사회복지 계열 업종 해당", excluded: "법 제31조(같은 조 제3항 특별교육 제외)" });

      if (Number.isFinite(workerCount) && workerCount < 50) {
        const item3 = d === 1 || d === 3 || containsNorm(m, "환경 정화 및 복원업") || d === 47 || containsNorm(m, "영화, 비디오물, 방송프로그램 제작 및 배급업") || containsNorm(m, "녹음시설운영업") || d === 60 || (d === 68 && !containsNorm(m, "부동산 관리업")) || (containsNorm(m, "임대업") && !containsNorm(m, "부동산")) || d === 70 || (d === 86 && !containsNorm(m, "병원")) || d === 90 || d === 91 || d === 94 || (d === 96 && !containsNorm(m, "세탁업"));
        if (item3) entries.push({ item: "제3호", reason: "별표1 제3호 대상 업종 + 상시 근로자 50명 미만", excluded: "별표1 제3호 적용 제외 규정(원문 확인 필요)" });
      }

      const item4 = d === 84 || (d === 85 && !containsNorm(m, "청소년 수련시설 운영업")) || d === 99;
      if (item4) entries.push({ item: "제4호", reason: "공공행정·교육서비스(일부 제외)·국제 및 외국기관 해당", excluded: "법 제2장, 제3장, 제29조제1항~제8항/제10항, 제31조, 제31조의2, 제32조, 제32조의2, 제32조의3" });

      if (manualFlags.officeOnly) entries.push({ item: "제5호", reason: "사무직 근로자만 사용하는 사업장(수동 체크)", excluded: "별표1 제5호 적용 제외 규정(원문 확인 필요)" });
      if (Number.isFinite(workerCount) && workerCount < 5) entries.push({ item: "제6호", reason: "상시 근로자 5명 미만 사업장", excluded: "법 제2장, 제3장, 제31조(제3항 특별교육 제외), 제31조의2, 제32조, 제32조의2, 제32조의3, 제49조, 제50조, 제51조의2" });
      return entries;
    }

    function renderResult(mainItem, candidates) {
      qnaRenderToken += 1;
      const token = qnaRenderToken;
      const section = sectionFromCode(mainItem.code);
      const rules = getRulesBySection(section);
      const officeName = officeEl.value.trim();
      const workerCountRaw = workerCountEl.value.trim();
      const workerCount = workerCountRaw === "" ? NaN : Number(workerCountRaw);
      const annexMatches = evaluateAnnex1(mainItem, workerCount, { officeOnly: officeOnlyEl.checked, mineLaw: mineLawEl.checked, nuclearLaw: nuclearLawEl.checked, aviationLaw: aviationLawEl.checked, shipLaw: shipLawEl.checked });
      const qnaLoadingHtml = `<p class="empty">질의회시 검색결과 확인 중...</p>`;

      const ruleRows = rules.map((r) => [r[0], linkifyLawText(r[1], "rule")]);
      const penaltyRows = COMMON_PENALTIES.map((p) => [p[0], linkifyLawText(p[1], "law"), p[2]]);
      const annexRows = (annexMatches.length ? annexMatches.map((x) => [x.item, x.reason, x.excluded]) : [["해당 없음", "입력한 업종/근로자수/체크 기준으로는 별표1 적용 제외 항목 미확인", "-"]]).map((x) => [x[0], x[1], linkifyLawText(x[2], "decree")]);

      const rulesTable = renderTable(["구분", "산업안전보건기준에 관한 규칙 조문"], ruleRows, [1]);
      const penaltyTable = renderTable(["위반 유형(대표)", "과태료 근거 조문", "과태료 금액"], penaltyRows, [1]);
      const annexTable = renderTable(["별표1 해당호", "해당 사유(판정근거)", "적용 제외 규정(요약)"], annexRows, [2]);
      const links = SOURCES.map((s) => `<li><a href="${s.url}" target="_blank" rel="noopener noreferrer">${escapeHtml(s.label)}</a></li>`).join("");

      const candidateButtons = candidates.slice(0, 10).map((c) => `<button class="match" data-code="${escapeHtml(c.code)}">${escapeHtml(c.code)} ${escapeHtml(c.name)}</button>`).join("");

      resultEl.innerHTML = `
        <h2 class="result-title">${escapeHtml(mainItem.name)} 조회 결과</h2>
        <p class="note">인식된 KSIC: <code>${escapeHtml(mainItem.code)}</code> (${mainItem.digit}자리), 대분류 섹션: <code>${escapeHtml(section || "확인필요")}</code></p>
        <h3>1) 사업주 준수 조문 (산업안전보건기준에 관한 규칙)</h3>
        ${rulesTable}
        <h3 style="margin-top:14px;">2) 과태료 조항 및 금액 (산업안전보건법/시행령 별표35 기반)</h3>
        ${penaltyTable}
        <h3 style="margin-top:14px;">3) 산업안전보건법 시행령 별표1 적용 제외 여부</h3>
        ${annexTable}
        <h3 style="margin-top:14px;">4) 업종별 고용노동부 질의회시(예시 5건)</h3>
        <div id="qnaContainer">${qnaLoadingHtml}</div>
        <div class="warn">
          주의: 과태료는 위반횟수(1·2·3차), 위반행위 세부유형, 사업장 규모 감경, 대상 인원 수(예: 건강진단) 등에 따라 달라집니다.
          별표1 판정은 KSIC 기반 자동추정과 사용자 체크를 함께 사용한 결과이므로, 최종 적용은 최신 법령 원문으로 반드시 재확인해야 합니다.
          질의회시는 고용노동부 본부 검색, 관할지청 키워드 검색, 고객상담센터(1350) 검색을 확인해 결과가 있는 항목만 표시합니다.
        </div>
        <div style="margin-top:12px;">
          <strong>유사 검색 결과</strong>
          <div class="match-list">${candidateButtons || "<span class='empty'>후보 없음</span>"}</div>
        </div>
        <div class="links" style="margin-top:12px;">
          <strong>법령 확인 링크</strong>
          <ul>${links}</ul>
        </div>
      `;

      resultEl.querySelectorAll(".match[data-code]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const code = btn.getAttribute("data-code");
          const picked = CODE_TO_ITEM.get(code);
          if (!picked) return;
          inputEl.value = `${picked.code} ${picked.name}`;
          renderResult(picked, candidates);
        });
      });

      const qnaContainer = document.getElementById("qnaContainer");
      renderQnaTableVerified(getMoelQnaBySection(section), token, officeName).then((html) => {
        if (token !== qnaRenderToken) return;
        if (qnaContainer) qnaContainer.innerHTML = html || `<p class="empty">확인 가능한 질의회시 검색결과가 없어 표시할 항목이 없습니다.</p>`;
      });
    }

    function runSearch() {
      const query = inputEl.value;
      const results = searchKSIC(query);
      if (!results.length) {
        resultEl.innerHTML = `<h2 class="result-title">조회 결과 없음</h2><p class="empty">입력값 "${escapeHtml(query)}"에 해당하는 KSIC 업종을 찾지 못했습니다. 업종명을 더 짧게 입력하거나 KSIC 코드를 입력해 보세요.</p>`;
        return;
      }
      renderResult(results[0], results);
    }

    function renderLiveExamples() {
      const query = inputEl.value;
      const results = searchKSIC(query, 8);
      if (!query.trim()) {
        liveMatchesEl.innerHTML = "<span class='empty'>업종 키워드를 입력하면 유사 업종을 보여줍니다.</span>";
        return;
      }
      if (!results.length) {
        liveMatchesEl.innerHTML = "<span class='empty'>유사 업종을 찾지 못했습니다.</span>";
        return;
      }
      liveMatchesEl.innerHTML = results.map((r) => `<button class="match" data-live-code="${escapeHtml(r.code)}">${escapeHtml(r.code)} ${escapeHtml(r.name)}</button>`).join("");
      liveMatchesEl.querySelectorAll(".match[data-live-code]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const code = btn.getAttribute("data-live-code");
          const picked = CODE_TO_ITEM.get(code);
          if (!picked) return;
          inputEl.value = `${picked.code} ${picked.name}`;
          runSearch();
          renderLiveExamples();
        });
      });
    }

    function buildSuggestions() {
      const tags = ["플라스틱 용기 제조업", "시스템 소프트웨어 개발 및 공급업", "아파트 건설업", "한식 음식점업", "20129", "58221"];
      suggEl.innerHTML = tags.map((t) => `<span class="tag" data-key="${escapeHtml(t)}">${escapeHtml(t)}</span>`).join("");
      suggEl.querySelectorAll(".tag").forEach((tag) => {
        tag.addEventListener("click", () => {
          inputEl.value = tag.getAttribute("data-key") || "";
          runSearch();
          renderLiveExamples();
        });
      });
    }

    metaEl.textContent = KSIC.length ? `KSIC 제11차 전체 코드 로드 완료: ${KSIC.length.toLocaleString("ko-KR")}개 (1~5자리 전체 계층)` : "KSIC 데이터 로드 실패: ksic11_full.js 파일을 같은 폴더에 두세요.";
    buildSuggestions();
    renderLiveExamples();
    btnEl.addEventListener("click", runSearch);
    inputEl.addEventListener("keydown", (e) => { if (e.key === "Enter") runSearch(); });
    inputEl.addEventListener("input", renderLiveExamples);
    workerCountEl.addEventListener("keydown", (e) => { if (e.key === "Enter") runSearch(); });
  </script>
</body>
