<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KSIC 전 업종 산업안전보건 규칙·과태료 조회기</title>
  <style>
    :root {
      --bg1: #f2f7f6;
      --bg2: #e8eef8;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #475569;
      --line: #dbe3ee;
      --accent: #0f766e;
      --accent2: #1d4ed8;
      --warn: #9a3412;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Noto Sans KR", "Malgun Gothic", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 10% 0%, #d9f2ee 0%, transparent 35%),
        radial-gradient(circle at 90% 10%, #dbeafe 0%, transparent 30%),
        linear-gradient(180deg, var(--bg1), var(--bg2));
      min-height: 100vh;
      padding: 24px;
    }

    .container {
      max-width: 1120px;
      margin: 0 auto;
      display: grid;
      gap: 16px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: 0 8px 22px rgba(15, 23, 42, 0.06);
      padding: 18px;
    }

    h1 { margin: 0 0 6px; font-size: 26px; line-height: 1.2; }

    .sub, .meta, .note {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.55;
    }

    .search-wrap {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      margin-top: 12px;
    }

    .extra-grid {
      margin-top: 10px;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .field {
      display: grid;
      gap: 6px;
    }

    .field label {
      font-size: 13px;
      color: var(--muted);
    }

    input[type="text"],
    input[type="number"] {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 15px;
      outline: none;
    }

    input[type="text"]:focus,
    input[type="number"]:focus {
      border-color: var(--accent2);
      box-shadow: 0 0 0 3px rgba(29, 78, 216, 0.12);
    }

    .check-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 14px;
      margin-top: 2px;
    }

    .check-row label {
      font-size: 13px;
      color: #334155;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 0 16px;
      font-size: 14px;
      font-weight: 700;
      color: #fff;
      background: linear-gradient(135deg, var(--accent), #0d9488);
      cursor: pointer;
    }

    button:hover { filter: brightness(1.03); }

    .tag-list {
      margin-top: 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tag {
      border: 1px solid #bfded8;
      background: #eefaf8;
      color: #0f766e;
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 12px;
      cursor: pointer;
      user-select: none;
    }

    .result-title {
      margin: 0 0 8px;
      font-size: 20px;
      color: #0b3f3a;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      border: 1px solid var(--line);
      margin-top: 8px;
    }

    th, td {
      border: 1px solid var(--line);
      padding: 10px;
      text-align: left;
      vertical-align: top;
      font-size: 14px;
      line-height: 1.45;
    }

    th {
      background: #f5f9ff;
      color: #1e3a8a;
      font-weight: 700;
    }

    .warn {
      border: 1px solid #fed7aa;
      background: #fff7ed;
      color: var(--warn);
      border-radius: 10px;
      padding: 10px;
      font-size: 13px;
      line-height: 1.5;
      margin-top: 12px;
    }

    .links a { color: var(--accent2); text-decoration: none; }
    .links a:hover { text-decoration: underline; }

    .empty { color: var(--muted); font-size: 14px; padding: 8px 0; }

    .match-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    .match {
      border: 1px solid #cbd5e1;
      background: #fff;
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 12px;
      color: #1e293b;
      cursor: pointer;
    }

    .match:hover {
      border-color: #94a3b8;
      background: #f8fafc;
    }

    code {
      background: #f1f5f9;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      padding: 1px 6px;
      font-size: 12px;
    }

    @media (max-width: 760px) {
      .search-wrap { grid-template-columns: 1fr; }
      .extra-grid { grid-template-columns: 1fr; }
      button { height: 42px; }
    }
  </style>
</head>
<body>
  <main class="container">
    <section class="card">
      <h1>KSIC 전 업종 산업안전보건 규칙·과태료 조회기</h1>
      <p class="sub">업종명 또는 KSIC 코드(예: <code>20129</code>, <code>C</code>)를 입력하면 해당 업종의 KSIC 분류를 인식해 사업주가 우선 확인할 조문을 보여줍니다.</p>
      <p class="meta" id="loadedMeta">KSIC 데이터 로딩 중...</p>
      <div class="search-wrap">
        <input id="industryInput" type="text" placeholder="예: 플라스틱 용기 제조업, 시스템 소프트웨어 개발 및 공급업, 20129" />
        <button id="searchBtn" type="button">조회</button>
      </div>
      <div class="extra-grid">
        <div class="field">
          <label for="workerCountInput">상시 근로자 수(명)</label>
          <input id="workerCountInput" type="number" min="0" step="1" placeholder="예: 12" />
        </div>
        <div class="field">
          <label>별표1 수동 체크(해당 시)</label>
          <div class="check-row">
            <label><input id="officeOnlyInput" type="checkbox" /> 사무직만 사용 사업장</label>
            <label><input id="mineLawInput" type="checkbox" /> 광산안전법 적용</label>
            <label><input id="nuclearLawInput" type="checkbox" /> 원자력안전법 적용</label>
            <label><input id="aviationLawInput" type="checkbox" /> 항공안전법 적용</label>
            <label><input id="shipLawInput" type="checkbox" /> 선박안전법 적용</label>
          </div>
        </div>
      </div>
      <div class="tag-list" id="suggestions"></div>
      <p class="note">입력 예시: 업종명(부분 검색 가능), KSIC 코드(1~5자리). 상시 근로자 수를 함께 넣으면 산업안전보건법 시행령 별표1 적용 제외 여부를 함께 판정합니다.</p>
    </section>

    <section class="card" id="resultBox">
      <p class="empty">업종을 입력하고 조회 버튼을 누르세요.</p>
    </section>
  </main>

  <script src="./ksic11_full.js"></script>
  <script>

      P: [["교육서비스 실습장 안전", "기계·화학·전기 실습 유형별 조문"]],
      Q: [["보건·사회복지 유해요인 관리", "유해물질·작업환경·보호구 조문"]],
      R: [["문화·체육시설 안전관리", "작업장 기본·전기·화재 조문"]],
      S: [["수리·개인서비스 기계·전기 안전", "기계 방호·전기·화재 조문"]],
      T: [["가사서비스 안전", "작업장 기본·화재·보호구 조문"]],
      U: [["국제·외국기관 시설안전", "작업장 기본·화재·보호구 조문"]]
    };

    const COMMON_PENALTIES = [
      ["안전보건관리책임자 미선임", "산업안전보건법 제175조제5항제1호", "500만원"],
      ["산업안전보건위원회 정기회의 미개최", "산업안전보건법 제175조제5항제1호", "1차 50만원 / 2차 250만원 / 3차 500만원"],
      ["안전검사 대상기계 안전검사 미실시", "산업안전보건법 제175조제4항제3호", "1차 200~300만원 / 2차 600만원 / 3차 1,000만원(유형별)"],
      ["안전검사합격증명서 미부착", "산업안전보건법 제175조제5항제1호", "1차 50만원 / 2차 250만원 / 3차 500만원"],
      ["건강진단 미실시(대상자 1명당)", "산업안전보건법 제175조제4항제7호", "1차 10만원 / 2차 20만원 / 3차 30만원"]
    ];

    const SOURCES = [
      { label: "국가법령정보센터: 산업안전보건기준에 관한 규칙", url: "https://www.law.go.kr/LSW/lsInfoP.do?lsiSeq=273603" },
      { label: "국가법령정보센터: 산업안전보건법", url: "https://www.law.go.kr/LSW/lsInfoP.do?lsiSeq=273685" },
      { label: "국가법령정보센터: 산업안전보건법 시행령(별표35 과태료)", url: "https://www.law.go.kr/LSW/lsInfoP.do?lsiSeq=273350" },
      { label: "국가법령정보센터: 산업안전보건법 시행령 별표1(적용 제외)", url: "https://law.go.kr/LSW/flDownload.do?flNm=%5B%EB%B3%84%ED%91%9C+1%5D+%EB%B2%95%EC%9D%98+%EC%9D%BC%EB%B6%80%EB%A5%BC+%EC%A0%81%EC%9A%A9%ED%95%98%EC%A7%80+%EC%95%84%EB%8B%88%ED%95%98%EB%8A%94+%EC%82%AC%EC%97%85+%EB%B0%8F+%EA%B7%9C%EC%A0%95%28%EC%A0%9C2%EC%A1%B0%EC%9D%982%EC%A0%9C1%ED%95%AD+%EA%B4%80%EB%A0%A8%29%0A&flSeq=43122215" }
    ];

    const SECTION_BY_DIVISION = [
      [1, 3, "A"], [5, 8, "B"], [10, 34, "C"], [35, 35, "D"], [36, 39, "E"],
      [41, 42, "F"], [45, 47, "G"], [49, 52, "H"], [55, 56, "I"], [58, 63, "J"],
      [64, 66, "K"], [68, 68, "L"], [70, 73, "M"], [74, 76, "N"], [84, 84, "O"],
      [85, 85, "P"], [86, 87, "Q"], [90, 91, "R"], [94, 96, "S"], [97, 98, "T"], [99, 99, "U"]
    ];

    const inputEl = document.getElementById("industryInput");
    const workerCountEl = document.getElementById("workerCountInput");
    const officeOnlyEl = document.getElementById("officeOnlyInput");
    const mineLawEl = document.getElementById("mineLawInput");
    const nuclearLawEl = document.getElementById("nuclearLawInput");
    const aviationLawEl = document.getElementById("aviationLawInput");
    const shipLawEl = document.getElementById("shipLawInput");
    const btnEl = document.getElementById("searchBtn");
    const resultEl = document.getElementById("resultBox");
    const suggEl = document.getElementById("suggestions");
    const metaEl = document.getElementById("loadedMeta");

    const CODE_TO_ITEM = new Map(KSIC.map((row) => [row.code, row]));

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function normalize(value) {
      return String(value || "")
        .toLowerCase()
        .replace(/\s+/g, "")
        .replace(/[()\[\],./·\-~;:]/g, "");
    }

    function containsNorm(text, keyword) {
      return normalize(text).includes(normalize(keyword));
    }

    function sectionFromCode(code) {
      if (/^[A-U]$/.test(code)) return code;
      const div = Number(String(code).slice(0, 2));
      if (!Number.isFinite(div)) return null;
      for (const [start, end, section] of SECTION_BY_DIVISION) {
        if (div >= start && div <= end) return section;
      }
      return null;
    }

    function getDivision(code) {
      if (/^[A-U]$/.test(code)) return null;
      const n = Number(String(code).slice(0, 2));
      return Number.isFinite(n) ? n : null;
    }

    function getContext(mainItem) {
      const rawCode = String(mainItem.code);
      const section = sectionFromCode(rawCode);
      const codes = [];
      if (section) codes.push(section);
      if (!/^[A-U]$/.test(rawCode)) {
        if (rawCode.length >= 2) codes.push(rawCode.slice(0, 2));
        if (rawCode.length >= 3) codes.push(rawCode.slice(0, 3));
        if (rawCode.length >= 4) codes.push(rawCode.slice(0, 4));
        if (rawCode.length >= 5) codes.push(rawCode.slice(0, 5));
      }

      const uniqueCodes = [...new Set(codes)];
      const names = uniqueCodes
        .map((code) => (CODE_TO_ITEM.get(code) || {}).name)
        .filter(Boolean);

      return {
        section,
        division: getDivision(rawCode),
        names,
        joined: names.join(" "),
        normalizedJoined: normalize(names.join(" "))
      };
    }

    function renderTable(headers, rows) {
      const head = headers.map((h) => `<th>${escapeHtml(h)}</th>`).join("");
      const body = rows
        .map((r) => `<tr>${r.map((c) => `<td>${escapeHtml(c)}</td>`).join("")}</tr>`)
        .join("");
      return `<table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>`;
    }

    function searchKSIC(query) {
      const raw = String(query || "").trim();
      const qNorm = normalize(raw);
      if (!qNorm) return [];

      const codeLike = raw.toUpperCase();
      if (/^[A-U]$/.test(codeLike) || /^\d{2,5}$/.test(codeLike)) {
        const exact = CODE_TO_ITEM.get(codeLike);
        if (exact) return [exact];
      }

      const scored = [];
      for (const item of KSIC) {
        const nameNorm = normalize(item.name);
        const code = item.code;
        let score = 0;

        if (nameNorm === qNorm) score += 120;
        else if (nameNorm.startsWith(qNorm)) score += 95;
        else if (nameNorm.includes(qNorm)) score += 80;

        if (qNorm.includes(nameNorm) && nameNorm.length > 1) score += 25;
        if (code.toLowerCase() === qNorm) score += 140;
        else if (code.toLowerCase().startsWith(qNorm)) score += 45;

        if (score > 0) scored.push({ item, score });
      }

      scored.sort((a, b) => b.score - a.score || b.item.digit - a.item.digit || a.item.code.localeCompare(b.item.code));
      return scored.slice(0, 20).map((v) => v.item);
    }

    function getRulesBySection(section) {
      return [...COMMON_RULES, ...(SECTION_RULES[section] || [])];
    }

    function evaluateAnnex1(mainItem, workerCount, manualFlags) {
      const ctx = getContext(mainItem);
      const m = ctx.normalizedJoined;
      const d = ctx.division;
      const entries = [];

      if (manualFlags.mineLaw || manualFlags.nuclearLaw || manualFlags.aviationLaw || manualFlags.shipLaw) {
        entries.push({
          item: "제1호",
          reason: "광산/원자력/항공/선박 안전 관련 타법 적용 사업(수동 체크)",
          excluded: "별표1 제1호 적용 제외 규정(법 제13·14·15·제3장 등)"
        });
      }

      const item2 =
        containsNorm(m, "소프트웨어 개발 및 공급업") ||
        containsNorm(m, "컴퓨터 프로그래밍") ||
        containsNorm(m, "시스템 통합 및 관리업") ||
        containsNorm(m, "정보서비스업") ||
        ctx.section === "K" ||
        containsNorm(m, "전문서비스업") ||
        containsNorm(m, "건축기술, 엔지니어링 및 기타 과학기술 서비스업") ||
        (containsNorm(m, "기타 전문, 과학 및 기술 서비스업") && !containsNorm(m, "사진 처리업")) ||
        containsNorm(m, "사업지원 서비스업") ||
        containsNorm(m, "사회복지 서비스업");

      if (item2) {
        entries.push({
          item: "제2호",
          reason: "소프트웨어·정보서비스·금융보험·전문과학기술·사업지원·사회복지 계열 업종 해당",
          excluded: "법 제31조(같은 조 제3항 특별교육 제외)"
        });
      }

      const under50 = Number.isFinite(workerCount) && workerCount < 50;
      if (under50) {
        const item3 =
          d === 1 ||
          d === 3 ||
          containsNorm(m, "환경 정화 및 복원업") ||
          d === 47 ||
          containsNorm(m, "영화, 비디오물, 방송프로그램 제작 및 배급업") ||
          containsNorm(m, "녹음시설운영업") ||
          d === 60 ||
          (d === 68 && !containsNorm(m, "부동산 관리업")) ||
          (containsNorm(m, "임대업") && !containsNorm(m, "부동산")) ||
          d === 70 ||
          (d === 86 && !containsNorm(m, "병원")) ||
          d === 90 ||
          d === 91 ||
          d === 94 ||
          (d === 96 && !containsNorm(m, "세탁업"));

        if (item3) {
          entries.push({
            item: "제3호",
            reason: "별표1 제3호 대상 업종 + 상시 근로자 50명 미만",
            excluded: "별표1 제3호 적용 제외 규정(원문 확인 필요)"
          });
        }
      }

      const item4 =
        d === 84 ||
        (d === 85 && !containsNorm(m, "청소년 수련시설 운영업")) ||
        d === 99;

      if (item4) {
        entries.push({
          item: "제4호",
          reason: "공공행정·교육서비스(일부 제외)·국제 및 외국기관 해당",
          excluded: "법 제2장, 제3장, 제29조제1항~제8항/제10항, 제31조, 제31조의2, 제32조, 제32조의2, 제32조의3"
        });
      }

      if (manualFlags.officeOnly) {
        entries.push({
          item: "제5호",
          reason: "사무직 근로자만 사용하는 사업장(수동 체크)",
          excluded: "별표1 제5호 적용 제외 규정(원문 확인 필요)"
        });
      }

      const under5 = Number.isFinite(workerCount) && workerCount < 5;
      if (under5) {
        entries.push({
          item: "제6호",
          reason: "상시 근로자 5명 미만 사업장",
          excluded: "법 제2장, 제3장, 제31조(제3항 특별교육 제외), 제31조의2, 제32조, 제32조의2, 제32조의3, 제49조, 제50조, 제51조의2"
        });
      }

      return entries;
    }

    function renderResult(mainItem, candidates) {
      const section = sectionFromCode(mainItem.code);
      const rules = getRulesBySection(section);
      const workerCountRaw = workerCountEl.value.trim();
      const workerCount = workerCountRaw === "" ? NaN : Number(workerCountRaw);
      const annexMatches = evaluateAnnex1(mainItem, workerCount, {
        officeOnly: officeOnlyEl.checked,
        mineLaw: mineLawEl.checked,
        nuclearLaw: nuclearLawEl.checked,
        aviationLaw: aviationLawEl.checked,
        shipLaw: shipLawEl.checked
      });

      const rulesTable = renderTable(["구분", "산업안전보건기준에 관한 규칙 조문"], rules);
      const penaltyTable = renderTable(["위반 유형(대표)", "과태료 근거 조문", "과태료 금액"], COMMON_PENALTIES);
      const annexTable = renderTable(
        ["별표1 해당호", "해당 사유(판정근거)", "적용 제외 규정(요약)"],
        annexMatches.length
          ? annexMatches.map((x) => [x.item, x.reason, x.excluded])
          : [["해당 없음", "입력한 업종/근로자수/체크 기준으로는 별표1 적용 제외 항목 미확인", "-"]]
      );
      const links = SOURCES
        .map((s) => `<li><a href="${s.url}" target="_blank" rel="noopener noreferrer">${escapeHtml(s.label)}</a></li>`)
        .join("");

      const candidateButtons = candidates
        .slice(0, 10)
        .map((c) => `<button class="match" data-code="${escapeHtml(c.code)}">${escapeHtml(c.code)} ${escapeHtml(c.name)}</button>`)
        .join("");

      resultEl.innerHTML = `
        <h2 class="result-title">${escapeHtml(mainItem.name)} 조회 결과</h2>
        <p class="note">인식된 KSIC: <code>${escapeHtml(mainItem.code)}</code> (${mainItem.digit}자리), 대분류 섹션: <code>${escapeHtml(section || "확인필요")}</code></p>
        <h3>1) 사업주 준수 조문 (산업안전보건기준에 관한 규칙)</h3>
        ${rulesTable}
        <h3 style="margin-top:14px;">2) 과태료 조항 및 금액 (산업안전보건법/시행령 별표35 기반)</h3>
        ${penaltyTable}
        <h3 style="margin-top:14px;">3) 산업안전보건법 시행령 별표1 적용 제외 여부</h3>
        ${annexTable}
        <div class="warn">
          주의: 과태료는 위반횟수(1·2·3차), 위반행위 세부유형, 사업장 규모 감경, 대상 인원 수(예: 건강진단) 등에 따라 달라집니다.
          별표1 판정은 KSIC 기반 자동추정과 사용자 체크를 함께 사용한 결과이므로, 최종 적용은 최신 법령 원문으로 반드시 재확인해야 합니다.
        </div>
        <div style="margin-top:12px;">
          <strong>유사 검색 결과</strong>
          <div class="match-list">${candidateButtons || "<span class='empty'>후보 없음</span>"}</div>
        </div>
        <div class="links" style="margin-top:12px;">
          <strong>법령 확인 링크</strong>
          <ul>${links}</ul>
        </div>
      `;

      resultEl.querySelectorAll(".match[data-code]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const code = btn.getAttribute("data-code");
          const picked = CODE_TO_ITEM.get(code);
          if (!picked) return;
          inputEl.value = `${picked.code} ${picked.name}`;
          renderResult(picked, candidates);
        });
      });
    }

    function runSearch() {
      const query = inputEl.value;
      const results = searchKSIC(query);

      if (!results.length) {
        resultEl.innerHTML = `
          <h2 class="result-title">조회 결과 없음</h2>
          <p class="empty">입력값 "${escapeHtml(query)}"에 해당하는 KSIC 업종을 찾지 못했습니다. 업종명을 더 짧게 입력하거나 KSIC 코드를 입력해 보세요.</p>
        `;
        return;
      }

      renderResult(results[0], results);
    }

    function buildSuggestions() {
      const tags = [
        "플라스틱 용기 제조업",
        "시스템 소프트웨어 개발 및 공급업",
        "아파트 건설업",
        "한식 음식점업",
        "20129",
        "58221"
      ];
      suggEl.innerHTML = tags.map((t) => `<span class="tag" data-key="${escapeHtml(t)}">${escapeHtml(t)}</span>`).join("");

      suggEl.querySelectorAll(".tag").forEach((tag) => {
        tag.addEventListener("click", () => {
          inputEl.value = tag.getAttribute("data-key") || "";
          runSearch();
        });
      });
    }

    metaEl.textContent = KSIC.length
      ? `KSIC 제11차 전체 코드 로드 완료: ${KSIC.length.toLocaleString("ko-KR")}개 (1~5자리 전체 계층)`
      : "KSIC 데이터 로드 실패: ksic11_full.js 파일을 같은 폴더에 두세요.";

    buildSuggestions();
    btnEl.addEventListener("click", runSearch);
    inputEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter") runSearch();
    });
    workerCountEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter") runSearch();
    });
  </script>
</body>
</html>
